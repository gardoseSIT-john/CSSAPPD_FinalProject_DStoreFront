<div class="uploader">
  <label for="image-files">Images (the first is the cell image)</label>
  <input
    id="image-files"
    type="file"
    accept="image/*"
    multiple
    [disabled]="uploading()"
    (change)="onFiles($event)"
  />

  @if (uploading()) {
    <p role="status">Uploading…</p>
  }
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }

  <ul class="list">
    @for (url of images(); track url) {
      <li>
        <img [src]="url" alt="" width="80" height="80" />
        @if ($index === 0) {
          <span class="badge">Cell image</span>
        } @else {
          <button type="button" (click)="makeFirst($index)">Make first</button>
        }
        <button type="button" (click)="remove($index)" [attr.aria-label]="'Remove image ' + ($index + 1)">
          Remove
        </button>
      </li>
    }
  </ul>
</div>
