<header class="search">
  <label for="search">Search products</label>
  <input
    id="search"
    type="search"
    placeholder="Search by name or tag"
    [value]="query()"
    (input)="onSearch($event)"
  />
  @if (tag(); as t) {
    <p role="status">Showing: {{ t }} <a routerLink="/">Clear</a></p>
  }
</header>

<app-error-banner (retry)="load()" />

@if (loading()) {
  <p class="status" role="status">Loading…</p>
} @else if (!failed()) {
  <main class="grid">
    @for (p of filtered(); track p._id) {
      <app-product-cell [product]="p" />
    } @empty {
      <p>No products match your search.</p>
    }
  </main>
}
