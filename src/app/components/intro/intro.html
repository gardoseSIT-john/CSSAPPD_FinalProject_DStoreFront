@if (stage() === 1) {
  <section class="stage">
    <p class="small">{{ brand.name }} &middot; Online Store</p>
    <h1 class="welcome">Welcome</h1>
    <span class="line"></span>
    <p class="hint">Click anywhere to continue</p>
  </section>
} @else {
  <section class="stage reveal">
    <span class="bar"></span>

    <p class="small late">This is</p>
    <h1 class="mark">{{ brand.name }}</h1>
    <p class="tagline">{{ brand.tagline }}</p>
    <p class="hint slow">Click anywhere to enter</p>
  </section>
}
